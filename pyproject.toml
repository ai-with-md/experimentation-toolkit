[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "exptoolkit"
version = "0.1.0"
description = "Experiment design and causal inference on public data"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "statsmodels>=0.14",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
notebooks = ["jupyter", "nbformat", "nbconvert", "ipykernel"]
dev = ["pytest"]

[tool.setuptools]
packages = ["exptoolkit"]
